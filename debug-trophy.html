<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messi Trophy Positioning Debugger</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #3B1E1E; /* RedSands dark reddish-brown */
            --panel-bg: rgba(59, 30, 30, 0.85);
            --border-color: #A36B6B;
            --text-color: #FFFFFF;
            --text-muted: #E0C0C0;
            --accent-color: #FFD700; /* Gold */
            --accent-hover: #FFF;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        .control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        h2 {
            margin-top: 0;
            font-size: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .instructions {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .instructions ul {
            padding-left: 20px;
            margin: 5px 0;
        }

        .modes-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .mode-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .output-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 12px;
            font-family: monospace;
            font-size: 12px;
            margin-bottom: 15px;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
        }

        .copy-btn {
            width: 100%;
            background: var(--accent-color);
            border: none;
            color: #000;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background: var(--accent-hover);
        }

        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-msg {
            font-size: 16px;
            color: var(--text-color);
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
          }
        }
    </script>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="status-msg" id="status-msg">Loading 3D Models (Messi Statue & World Cup Trophy)...</div>
    </div>

    <div class="control-panel">
        <h2>Trophy Aligner</h2>
        <div class="instructions">
            Use the mouse and gizmo to place the trophy in Messi's hand.
            <ul>
                <li><b>T:</b> Translate (Move)</li>
                <li><b>R:</b> Rotate</li>
                <li><b>S:</b> Scale</li>
            </ul>
        </div>

        <div class="modes-container">
            <button class="mode-btn active" id="btn-translate">Translate</button>
            <button class="mode-btn" id="btn-rotate">Rotate</button>
            <button class="mode-btn" id="btn-scale">Scale</button>
        </div>

        <div class="output-box" id="output-box">// Drag gizmo to update coordinates</div>
        <button class="copy-btn" id="btn-copy">Copy to Clipboard</button>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // Variables
        let scene, camera, renderer, orbitControls, transformControls;
        let messiModel, trophyModel;
        let container = document.getElementById('canvas-container');
        let loader = new GLTFLoader();

        init();
        animate();

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x3B1E1E); // RedSands background

            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0.5, 3.5);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
            keyLight.position.set(-2, 3, 2);
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
            fillLight.position.set(2, 1, 2);
            scene.add(fillLight);

            // Environment simulation (PMREM)
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const envScene = new THREE.Scene();
            envScene.background = new THREE.Color(0x777777);
            const envMap = pmremGenerator.fromScene(envScene).texture;
            scene.environment = envMap;
            pmremGenerator.dispose();

            // Orbit Controls
            orbitControls = new OrbitControls(camera, renderer.domElement);
            orbitControls.enableDamping = true;
            orbitControls.dampingFactor = 0.05;
            orbitControls.target.set(0, 0, 0);

            // Transform Controls (gizmo)
            transformControls = new TransformControls(camera, renderer.domElement);
            transformControls.size = 0.75;
            scene.add(transformControls.getHelper());

            // Avoid orbit conflict with transform controls
            transformControls.addEventListener('dragging-changed', function (event) {
                orbitControls.enabled = !event.value;
            });

            // Update output on transform changes
            transformControls.addEventListener('change', updateOutput);

            // Load Models
            loadModels();

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            setupControlButtons();
            setupKeyboardShortcuts();
        }

        function loadModels() {
            const statusMsg = document.getElementById('status-msg');
            
            // Load Messi
            loader.load('jersey_3d_models/messi_statue.glb', (gltf) => {
                messiModel = gltf.scene;

                // Center & Scale exactly like the main code
                messiModel.rotation.y = -10 * Math.PI / 180;
                
                const box = new THREE.Box3().setFromObject(messiModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2 / maxDim;
                
                messiModel.scale.setScalar(scale);
                messiModel.position.sub(center.multiplyScalar(scale));
                
                scene.add(messiModel);
                statusMsg.innerText = "Messi loaded. Loading World Cup Trophy...";

                // Load Trophy
                loader.load('jersey_3d_models/world_cup_trophy.glb', (trophyGltf) => {
                    trophyModel = trophyGltf.scene;
                    
                    // Attach it to Messi parent so coordinates are relative to Messi
                    messiModel.add(trophyModel);
                    
                    // Initial positions
                    trophyModel.scale.setScalar(0.04);
                    trophyModel.position.set(-0.34, -0.16, 0.17);
                    trophyModel.rotation.set(-0.4, 1.05, 0.5);

                    // Attach gizmo
                    transformControls.attach(trophyModel);

                    // Update UI Output
                    updateOutput();

                    // Hide loading overlay
                    document.getElementById('loading-overlay').style.opacity = 0;
                    setTimeout(() => {
                        document.getElementById('loading-overlay').style.display = 'none';
                    }, 500);
                });
            });
        }

        function updateOutput() {
            if (!trophyModel) return;

            const pos = trophyModel.position;
            const rot = trophyModel.rotation;
            const scale = trophyModel.scale.x;

            const codeStr = `this.trophyObject.scale.setScalar(${scale.toFixed(4)});
this.trophyObject.position.set(${pos.x.toFixed(4)}, ${pos.y.toFixed(4)}, ${pos.z.toFixed(4)});
this.trophyObject.rotation.set(${rot.x.toFixed(4)}, ${rot.y.toFixed(4)}, ${rot.z.toFixed(4)});`;

            document.getElementById('output-box').innerText = codeStr;
        }

        function setupControlButtons() {
            const btnT = document.getElementById('btn-translate');
            const btnR = document.getElementById('btn-rotate');
            const btnS = document.getElementById('btn-scale');

            function clearActive() {
                btnT.classList.remove('active');
                btnR.classList.remove('active');
                btnS.classList.remove('active');
            }

            btnT.addEventListener('click', () => {
                clearActive();
                btnT.classList.add('active');
                transformControls.setMode('translate');
            });

            btnR.addEventListener('click', () => {
                clearActive();
                btnR.classList.add('active');
                transformControls.setMode('rotate');
            });

            btnS.addEventListener('click', () => {
                clearActive();
                btnS.classList.add('active');
                transformControls.setMode('scale');
            });

            // Copy
            document.getElementById('btn-copy').addEventListener('click', () => {
                const text = document.getElementById('output-box').innerText;
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('btn-copy');
                    const orig = btn.innerText;
                    btn.innerText = "COPIED!";
                    setTimeout(() => btn.innerText = orig, 1500);
                });
            });
        }

        function setupKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                switch(e.key.toLowerCase()) {
                    case 't':
                        document.getElementById('btn-translate').click();
                        break;
                    case 'r':
                        document.getElementById('btn-rotate').click();
                        break;
                    case 's':
                        document.getElementById('btn-scale').click();
                        break;
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            orbitControls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
